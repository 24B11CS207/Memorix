<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorix - Select Topic</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --purple:#7c5cfc; --blue:#38bdf8; --text:#fff; --text2:#9ca3af; --glass:rgba(18,20,40,.72); --border:rgba(124,92,252,.24); }
    * { box-sizing:border-box; margin:0; padding:0; font-family:Poppins,sans-serif; }
    body { min-height:100vh; background:linear-gradient(135deg,#060816,#11132b,#1a1040); color:var(--text); padding:110px 22px 60px; }
    nav { position:fixed; inset:0 0 auto; height:74px; display:flex; justify-content:space-between; align-items:center; padding:0 52px; background:rgba(7,8,22,.72); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,.08); }
    .logo { font-size:30px; font-weight:700; background:linear-gradient(135deg,#a78bfa,var(--blue)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    a { color:#fff; text-decoration:none; }
    .back { border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px 16px; }
    .wrap { max-width:1180px; margin:auto; }
    h1 { font-size:42px; text-align:center; margin-bottom:10px; }
    .sub { text-align:center; color:var(--text2); margin-bottom:30px; }
    .search-row { display:grid; grid-template-columns:1fr auto; gap:12px; margin-bottom:18px; }
    input { min-height:52px; border:1px solid rgba(255,255,255,.14); border-radius:14px; background:rgba(255,255,255,.07); color:#fff; padding:0 16px; font-size:16px; outline:none; }
    button { border:1px solid rgba(255,255,255,.12); border-radius:13px; background:rgba(255,255,255,.06); color:white; padding:12px 15px; cursor:pointer; transition:.25s; }
    button:hover { background:rgba(124,92,252,.2); border-color:#a78bfa; transform:translateY(-2px); }
    .primary { background:linear-gradient(135deg,var(--purple),#4f46e5); border:0; }
    .suggestions, .modules { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
    .module { border:1px solid var(--border); border-radius:18px; background:var(--glass); padding:20px; }
    .module.locked { opacity:.45; }
    .status { display:inline-block; margin-bottom:10px; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.08); color:var(--text2); font-size:12px; }
    .status.unlocked { background:rgba(34,197,94,.14); color:#86efac; }
    .module h2 { font-size:19px; margin-bottom:10px; }
    .module p, .learn-box, .test-box { color:var(--text2); line-height:1.7; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    .learn-box, .test-box { display:none; margin-top:14px; padding:14px; border-radius:13px; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.1); }
    .learn-box.show, .test-box.show { display:block; }
    .q { margin-top:12px; padding:12px; border-radius:11px; background:rgba(255,255,255,.05); }
    label { display:block; margin-top:8px; cursor:pointer; }
    .result { margin-top:12px; font-weight:600; }
    @media(max-width:700px){ nav{padding:0 20px;} h1{font-size:32px;} .search-row{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Memorix</div>
    <a class="back" href="subjects.html">Change Subject</a>
  </nav>

  <main class="wrap">
    <h1 id="title">Select Topic</h1>
    <p class="sub">Search or select a topic. Memorix will create 5 locked learning modules.</p>
    <div class="search-row">
      <input id="topicSearch" type="search" placeholder="Search topic">
      <button class="primary" onclick="buildModules()">Create Modules</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
    <div class="modules" id="modules"></div>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('eduUser') || 'null');
    if (!user || !user.email) window.location.href = 'index.html';
    const selectedPath = localStorage.getItem('selectedPath');
    const selectedSubject = localStorage.getItem('selectedSubject');
    if (!selectedPath) window.location.href = 'classes.html';
    if (!selectedSubject) window.location.href = 'subjects.html';

    const topicBank = {
      Mathematics: ['Fractions', 'Algebra', 'Trigonometry', 'Calculus', 'Probability'],
      Science: ['Photosynthesis', 'Atoms', 'Force', 'Electricity', 'Human Body'],
      English: ['Grammar', 'Tenses', 'Essay Writing', 'Comprehension', 'Vocabulary'],
      'Social Studies': ['Indian History', 'Geography', 'Civics', 'Economics', 'Constitution'],
      'Computer Basics': ['MS Office', 'Internet Basics', 'Keyboard Skills', 'Scratch Programming'],
      Physics: ['Mechanics', 'Waves', 'Optics', 'Thermodynamics', 'Current Electricity'],
      Chemistry: ['Organic Chemistry', 'Chemical Bonding', 'Acids and Bases', 'Periodic Table'],
      Botany: ['Plant Kingdom', 'Photosynthesis', 'Plant Anatomy', 'Genetics'],
      Zoology: ['Human Heart', 'Nervous System', 'Digestion', 'Respiration'],
      Programming: ['C Basics', 'Python Basics', 'Loops', 'Functions', 'OOP'],
      'Data Structures': ['Arrays', 'Linked List', 'Stack', 'Queue', 'Trees'],
      DBMS: ['ER Model', 'SQL', 'Normalization', 'Transactions'],
      Anatomy: ['Human Heart', 'Bones', 'Muscles', 'Nervous System'],
      Accounting: ['Journal Entries', 'Ledger', 'Trial Balance', 'Final Accounts'],
      Reasoning: ['Number Series', 'Coding Decoding', 'Blood Relations', 'Directions']
    };

    document.getElementById('title').textContent = `${selectedSubject} Topics`;
    const topics = topicBank[selectedSubject] || ['Introduction', 'Basics', 'Important Concepts', 'Practice Questions'];
    renderSuggestions(topics);

    document.getElementById('topicSearch').addEventListener('input', event => {
      const term = event.target.value.toLowerCase();
      renderSuggestions(topics.filter(topic => topic.toLowerCase().includes(term)));
    });

    function renderSuggestions(list) {
      document.getElementById('suggestions').innerHTML = list.map(topic =>
        `<button onclick="selectTopic('${topic.replace(/'/g, "\\'")}')">${topic}</button>`
      ).join('');
    }

    function selectTopic(topic) {
      document.getElementById('topicSearch').value = topic;
      buildModules();
    }

    function buildModules() {
      const topic = document.getElementById('topicSearch').value.trim();
      if (!topic) return document.getElementById('topicSearch').focus();
      const moduleData = ['Basics', 'Core Concepts', 'Examples', 'Application Practice', 'Final Revision'];
      document.getElementById('modules').innerHTML = moduleData.map((name, index) => `
        <section class="module ${index ? 'locked' : ''}" id="module-${index}">
          <span class="status ${index ? '' : 'unlocked'}" id="status-${index}">${index ? 'Locked' : 'Unlocked'}</span>
          <h2>Module ${index + 1}: ${topic} ${name}</h2>
          <p>${moduleText(index, topic)}</p>
          <div class="actions">
            <button class="primary" id="learn-${index}" onclick="openLearnPage(${index}, '${topic.replace(/'/g, "\\'")}')" ${index ? 'disabled' : ''}>Learn Module</button>
            <button id="test-${index}-btn" onclick="openTestPage(${index}, '${topic.replace(/'/g, "\\'")}')" ${index ? 'disabled' : ''}>${hasLearned(index, topic) ? 'Take Test' : 'Learn First'}</button>
          </div>
          <div class="learn-box" id="learn-box-${index}"></div>
          <div class="test-box" id="test-box-${index}"></div>
        </section>
      `).join('');
      applyUnlockedModules();
    }

    function moduleText(index, topic) {
      return [
        `Start with the meaning, keywords, and simple idea of ${topic}.`,
        `Understand rules, diagrams, formulas, and important sub-points.`,
        `Learn solved examples and step-by-step question patterns.`,
        `Apply ${topic} to mixed questions and real exam situations.`,
        `Revise, recall, and prepare for the final test on ${topic}.`
      ][index];
    }

    function openLearnPage(index, topic) {
      localStorage.setItem('selectedTopic', topic);
      localStorage.setItem('selectedModuleIndex', String(index));
      window.location.href = 'learn-module.html';
    }

    function openTestPage(index, topic) {
      localStorage.setItem('selectedTopic', topic);
      localStorage.setItem('selectedModuleIndex', String(index));
      if (!hasLearned(index, topic)) {
        window.location.href = 'learn-module.html';
        return;
      }
      window.location.href = 'module-test.html';
    }

    function hasLearned(index, topic) {
      return localStorage.getItem(`learned-${selectedPath}-${selectedSubject}-${topic}-${index}`) === 'yes';
    }

    function applyUnlockedModules() {
      const topic = document.getElementById('topicSearch').value.trim();
      const unlocked = Number(localStorage.getItem(`unlocked-${selectedPath}-${selectedSubject}-${topic}`) || '0');
      for (let index = 0; index <= unlocked; index++) {
        const module = document.getElementById(`module-${index}`);
        if (!module) continue;
        module.classList.remove('locked');
        document.getElementById(`status-${index}`).textContent = 'Unlocked';
        document.getElementById(`status-${index}`).classList.add('unlocked');
        document.getElementById(`learn-${index}`).disabled = false;
        document.getElementById(`test-${index}-btn`).disabled = false;
        document.getElementById(`test-${index}-btn`).textContent = hasLearned(index, topic) ? 'Take Test' : 'Learn First';
      }
    }
  </script>
</body>
</html>
