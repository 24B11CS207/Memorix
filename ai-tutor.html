<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b9eff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memorix">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/img/memorix-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/img/memorix-icon.svg">
  <title>Memorix - AI Tutor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --purple:#7c5cfc; --blue:#38bdf8; --cyan:#22d3ee; --text:#fff; --muted:#9ca3af; --panel:rgba(14,16,36,.82); --border:rgba(124,92,252,.28); }
    * { box-sizing:border-box; margin:0; padding:0; font-family:Poppins,sans-serif; }
    body { min-height:100vh; background:linear-gradient(135deg,#060816,#11132b,#1a1040); color:var(--text); padding:102px 20px 34px; }
    nav { position:fixed; inset:0 0 auto; height:74px; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:0 52px; background:rgba(7,8,22,.80); backdrop-filter:blur(16px); border-bottom:1px solid rgba(255,255,255,.08); }
    .logo { font-size:30px; font-weight:700; background:linear-gradient(135deg,#a78bfa,var(--blue)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    a, button { color:#fff; text-decoration:none; }
    .back, button { border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px 16px; background:rgba(255,255,255,.06); cursor:pointer; }
    button:hover, .back:hover { border-color:#a78bfa; background:rgba(124,92,252,.16); }
    .wrap { max-width:1040px; margin:auto; display:grid; grid-template-columns:300px minmax(0,1fr); gap:18px; }
    .panel { border:1px solid var(--border); border-radius:20px; background:var(--panel); backdrop-filter:blur(14px); }
    .side { padding:20px; }
    h1 { font-size:34px; line-height:1.15; margin-bottom:10px; background:linear-gradient(135deg,#fff,#a78bfa,var(--blue)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .muted { color:var(--muted); line-height:1.7; font-size:13px; }
    .context { margin-top:18px; display:grid; gap:10px; }
    .ctx { border:1px solid rgba(255,255,255,.08); border-radius:13px; padding:11px 13px; background:rgba(255,255,255,.04); }
    .ctx span { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
    .ctx strong { font-size:13px; overflow-wrap:anywhere; }
    .quick { margin-top:18px; display:grid; gap:8px; }
    .quick button { text-align:left; font-size:12px; line-height:1.5; padding:11px 12px; }
    .chat { min-height:calc(100vh - 138px); display:flex; flex-direction:column; overflow:hidden; }
    .chat-head { padding:18px 20px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .chat-head h2 { font-size:18px; }
    .status { font-size:11px; color:#86efac; border:1px solid rgba(34,197,94,.25); border-radius:999px; padding:5px 10px; background:rgba(34,197,94,.08); white-space:nowrap; }
    .log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:78%; padding:13px 15px; border-radius:17px; line-height:1.7; font-size:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .msg.bot { align-self:flex-start; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); color:#dbeafe; }
    .msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--purple),#4f46e5); box-shadow:0 0 18px rgba(124,92,252,.25); }
    .msg.thinking { color:var(--muted); font-style:italic; }
    .composer { border-top:1px solid rgba(255,255,255,.08); padding:14px; display:flex; gap:10px; }
    textarea { flex:1; min-height:52px; max-height:150px; resize:vertical; border:1px solid rgba(255,255,255,.12); border-radius:14px; background:rgba(255,255,255,.06); color:#fff; padding:13px 14px; outline:none; font-size:14px; line-height:1.5; }
    textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(56,189,248,.16); }
    .send { background:linear-gradient(135deg,var(--cyan),var(--blue)); border:0; color:#08111f; font-weight:700; min-width:92px; }
    .clear { margin-top:12px; width:100%; }
    @media(max-width:820px){ nav{padding:0 20px;} .wrap{grid-template-columns:1fr;} .chat{min-height:70vh;} .msg{max-width:92%;} }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Memorix</div>
    <a class="back" href="dashboard.html">Dashboard</a>
  </nav>

  <main class="wrap">
    <aside class="panel side">
      <h1>AI Tutor</h1>
      <p class="muted">Ask for explanations, examples, quizzes, hints, or mistake reviews. The tutor uses your current class, subject, and topic when available.</p>
      <div class="context">
        <div class="ctx"><span>Class / Path</span><strong id="ctxPath">Not selected</strong></div>
        <div class="ctx"><span>Subject</span><strong id="ctxSubject">Not selected</strong></div>
        <div class="ctx"><span>Topic</span><strong id="ctxTopic">Not selected</strong></div>
      </div>
      <div class="quick">
        <button type="button" onclick="usePrompt('Explain this topic in simple words with one example.')">Explain simply</button>
        <button type="button" onclick="usePrompt('Quiz me with 5 questions and wait for my answers one by one.')">Quiz me</button>
        <button type="button" onclick="usePrompt('Give me a revision summary and the most common mistakes.')">Revision help</button>
        <button type="button" onclick="usePrompt('I am confused. Teach the basics step by step.')">Start from basics</button>
      </div>
      <button class="clear" type="button" onclick="clearChat()">Clear Chat</button>
    </aside>

    <section class="panel chat">
      <div class="chat-head">
        <h2>Study Chat</h2>
        <span class="status" id="status">Ready</span>
      </div>
      <div class="log" id="chatLog"></div>
      <form class="composer" id="chatForm">
        <textarea id="chatInput" placeholder="Ask your tutor..." required></textarea>
        <button class="send" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('eduUser') || 'null');
    if (!user || !user.email) window.location.href = 'index.html';

    const selectedPath = localStorage.getItem('selectedPath') || '';
    const selectedSubject = localStorage.getItem('selectedSubject') || '';
    const selectedTopic = localStorage.getItem('selectedTopic') || localStorage.getItem(`deep-dive-active-topic-${selectedPath}-${selectedSubject}`) || '';
    const historyKey = `ai-tutor-history-${user.email}`;
    let history = [];

    const chatLog = document.getElementById('chatLog');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const statusEl = document.getElementById('status');

    document.getElementById('ctxPath').textContent = selectedPath || 'Not selected';
    document.getElementById('ctxSubject').textContent = selectedSubject || 'Not selected';
    document.getElementById('ctxTopic').textContent = selectedTopic || 'Not selected';

    loadChat();

    chatForm.addEventListener('submit', async event => {
      event.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;
      chatInput.value = '';
      await sendMessage(message);
    });

    chatInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    function loadChat() {
      try { history = JSON.parse(localStorage.getItem(historyKey) || '[]'); } catch { history = []; }
      chatLog.innerHTML = '';
      if (!history.length) {
        appendMessage(`Hi ${user.name || 'there'}! Tell me what you are studying and where you feel stuck.`, 'bot');
        return;
      }
      history.forEach(item => appendMessage(item.content, item.role === 'user' ? 'user' : 'bot'));
    }

    function appendMessage(text, who, extraClass = '') {
      const div = document.createElement('div');
      div.className = `msg ${who} ${extraClass}`.trim();
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      return div;
    }

    function saveHistory() {
      localStorage.setItem(historyKey, JSON.stringify(history.slice(-30)));
    }

    function usePrompt(text) {
      chatInput.value = text;
      chatInput.focus();
    }

    function clearChat() {
      history = [];
      localStorage.removeItem(historyKey);
      loadChat();
    }

    async function sendMessage(message) {
      appendMessage(message, 'user');
      history.push({ role:'user', content:message });
      saveHistory();

      statusEl.textContent = 'Thinking';
      const thinking = appendMessage('Thinking...', 'bot', 'thinking');
      try {
        const response = await fetch('/ai/api/tutor/', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body:JSON.stringify({
            message,
            history: history.slice(-12),
            topic: selectedTopic,
            subject: selectedSubject,
            class_name: selectedPath
          })
        });
        const data = await response.json();
        thinking.remove();
        const reply = data.reply || data.error || 'I could not answer that yet. Please try again.';
        appendMessage(reply, 'bot');
        history.push({ role:'assistant', content:reply });
        saveHistory();
        statusEl.textContent = data.source === 'fallback' ? 'Fallback' : 'Ready';
      } catch (error) {
        thinking.remove();
        appendMessage('Connection error. Please check that Django is running, then try again.', 'bot');
        statusEl.textContent = 'Offline';
      }
    }
  </script>
  <script src="/static/js/pwa.js"></script>
</body>
</html>
