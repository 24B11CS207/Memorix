<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorix - Access</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #050812;
      --card: rgba(10, 17, 35, 0.78);
      --card-border: rgba(67, 142, 235, 0.28);
      --blue: #3b9eff;
      --cyan: #03d8ff;
      --violet: #8d6cff;
      --text: #eef5ff;
      --muted: #8da0c2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(ellipse 70% 52% at 15% 12%, rgba(38, 117, 185, 0.24), transparent 62%),
        radial-gradient(ellipse 58% 48% at 78% 88%, rgba(82, 63, 164, 0.28), transparent 64%),
        radial-gradient(ellipse 46% 34% at 50% 58%, rgba(18, 95, 158, 0.12), transparent 66%),
        var(--bg-deep);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(93, 169, 255, 0.13) 1px, transparent 1.5px);
      background-size: 45px 45px;
      opacity: 0.32;
      pointer-events: none;
    }

    .welcome-shell {
      width: min(94vw, 528px);
      position: relative;
      z-index: 1;
    }

    .welcome-card {
      min-height: 486px;
      padding: 64px 52px 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 0 0 1px rgba(70, 142, 240, 0.08);
      backdrop-filter: blur(22px) saturate(150%);
    }

    .logo-tile {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin-bottom: 30px;
      border-radius: 24px;
      background: linear-gradient(135deg, #419dff, var(--violet));
      box-shadow: 0 0 46px rgba(59, 158, 255, 0.34);
      color: #fff;
      font-size: 42px;
    }

    .logo-tile i {
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 4.7rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 0;
      background: linear-gradient(90deg, var(--blue), var(--cyan) 48%, var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 380px;
      margin: 24px auto 36px;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.6;
      font-weight: 500;
    }

    .start-button {
      width: 100%;
      min-height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 16px;
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: 800;
      background: linear-gradient(135deg, #43a5fb, #2079d9);
      box-shadow: 0 12px 28px rgba(31, 130, 230, 0.36);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .start-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(31, 130, 230, 0.44);
    }

    @media (max-width: 560px) {
      .welcome-card {
        min-height: 430px;
        padding: 44px 28px;
        border-radius: 24px;
      }

      .logo-tile {
        width: 78px;
        height: 78px;
        font-size: 35px;
        margin-bottom: 24px;
      }

      p {
        font-size: 18px;
      }

      .start-button {
        min-height: 58px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="welcome-shell" aria-label="Memorix welcome">
    <section class="welcome-card">
      <div class="logo-tile" aria-hidden="true">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h1>Memorix</h1>
      <p>Learn by modules, take smart tests, and unlock your next topic step by step.</p>
      {% if user.is_authenticated %}
        <a class="start-button" href="{% url 'dashboard:home' %}">Get Started</a>
      {% else %}
        <a class="start-button" href="{% url 'accounts:login' %}">Get Started</a>
      {% endif %}
    </section>
  </main>
</body>
</html>
