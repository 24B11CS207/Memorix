{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="glass-card p-4 mt-5">
    <h3 class="text-danger">Delete this note?</h3>
    <p>"{{ note.title }}" will be permanently removed.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Delete</button>
      <a href="{% url 'notes:list' %}" class="btn btn-outline-light">Cancel</a>
    </form>
  </div>
</div></div>
{% endblock %}
