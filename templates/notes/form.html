{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8">
  <div class="glass-card p-4">
    <h2>{% if is_new %}New Note{% else %}Edit Note{% endif %}</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary">Save</button>
      <a href="{% url 'notes:list' %}" class="btn btn-outline-light">Cancel</a>
    </form>
  </div>
</div></div>
{% endblock %}
