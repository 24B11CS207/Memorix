{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="glass-card p-4 mt-5">
    <h3 class="text-danger">Delete Topic?</h3>
    <p>This will permanently delete <strong>{{ topic.name }}</strong>, all its modules, mini-tests, and revision plans. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'topics:detail' topic.id %}" class="btn btn-outline-light">Cancel</a>
    </form>
  </div>
</div></div>
{% endblock %}
