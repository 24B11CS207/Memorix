{% extends 'base.html' %}
{% block title %}AI Tutor — DQMS{% endblock %}
{% block content %}
<h2><i class="bi bi-robot"></i> AI Tutor Chat</h2>
<p class="text-muted">Ask anything about your topics. The tutor uses Azure OpenAI.</p>

<div class="glass-card p-0 chatbot-container">
  <div id="chatLog" class="chat-log p-3"></div>
  <form id="chatForm" class="chat-form p-3 border-top border-secondary d-flex gap-2">
    <input type="text" id="chatInput" class="form-control" placeholder="Type your question..." autocomplete="off" required>
    <button class="btn btn-primary"><i class="bi bi-send"></i></button>
  </form>
</div>
{% endblock %}

{% block extra_css %}
<style>
  .chatbot-container { display: flex; flex-direction: column; height: 65vh; }
  .chat-log { flex: 1; overflow-y: auto; }
  .chat-msg { margin-bottom: .75rem; padding: .75rem 1rem; border-radius: 1rem; max-width: 80%; white-space: pre-wrap; }
  .chat-msg.user { background: linear-gradient(135deg,#6366f1,#8b5cf6); margin-left: auto; }
  .chat-msg.bot { background: rgba(255,255,255,.08); }
  .chat-msg.thinking { opacity: .6; font-style: italic; }
</style>
{% endblock %}

{% block extra_js %}
<script>
const chatLog = document.getElementById('chatLog');
const chatForm = document.getElementById('chatForm');
const chatInput = document.getElementById('chatInput');
const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
const history = [];

function append(text, who) {
  const div = document.createElement('div');
  div.className = `chat-msg ${who}`;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

append("Hi! I'm your DQMS AI Tutor. What topic would you like help with?", 'bot');

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = chatInput.value.trim();
  if (!msg) return;
  append(msg, 'user');
  history.push({role: 'user', content: msg});
  chatInput.value = '';

  const thinking = append('Thinking...', 'bot');
  thinking.classList.add('thinking');

  try {
    const resp = await fetch("{% url 'ai_engine:chatbot_api' %}", {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
      body: JSON.stringify({history, message: msg})
    });
    const data = await resp.json();
    thinking.remove();
    const reply = data.reply || data.error || 'Error.';
    append(reply, 'bot');
    history.push({role: 'assistant', content: reply});
  } catch (err) {
    thinking.remove();
    append('Connection error. Please try again.', 'bot');
  }
});

function getCookie(name) {
  const v = `; ${document.cookie}`;
  const parts = v.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
}
</script>
{% endblock %}
